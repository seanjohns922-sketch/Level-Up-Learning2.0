<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RELIQ intro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Barlow:wght@500;600;700&display=swap">
<style>
/* RELIQ intro film: one 16:9 stage, scaled in container units so it fits any screen like a video. */
html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
body { display: grid; place-items: center; color: #fff; font-family: "Barlow", "Segoe UI", system-ui, sans-serif; }
[hidden] { display: none !important; }
:root {
  --night: #0b0610;
  --panel: #150d1c;
  --ink: #ffffff;
  --ink-soft: rgba(255,255,255,.72);
  --ink-faint: rgba(255,255,255,.42);
  --violet: #C94DF2;
  --violet-deep: #8C2EAC;
  --gold: #ffd36b;
  --line: rgba(255,255,255,.12);
  --head: "Montserrat", "Arial Black", system-ui, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}

.stage { position: relative; width: min(100vw, calc(100dvh * 16 / 9)); aspect-ratio: 16/9; overflow: hidden; background: #000; container-type: inline-size; user-select: none; -webkit-user-select: none; }
#cam, #shake { position: absolute; inset: 0; transform-origin: 50% 50%; }
.layer { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
.cover { position: absolute; inset: -5%; background-size: cover; background-position: center; }
canvas.fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

#halo { position: absolute; inset: 0; pointer-events: none; }
.rune { position: absolute; left: 0; top: 0; font: 900 2.6cqw/1 var(--head); color: #fff4cf; text-shadow: 0 0 .8cqw #ffd36b, 0 0 2.4cqw #ffae2b; will-change: transform, opacity; }
.beam { position: absolute; left: 50%; top: -10%; width: 9cqw; height: 60%; margin-left: -4.5cqw; background: linear-gradient(180deg, rgba(255,236,170,0), rgba(255,236,170,.75) 70%, rgba(255,255,255,.9)); filter: blur(1.2cqw); mix-blend-mode: screen; opacity: 0; }
.godrays { position: absolute; left: 50%; top: 32%; width: 160cqw; height: 160cqw; margin: -80cqw 0 0 -80cqw; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(255,214,120,0) 0 9deg, rgba(255,214,120,.16) 9deg 12deg); -webkit-mask: radial-gradient(circle, #000 0 10%, transparent 50%); mask: radial-gradient(circle, #000 0 10%, transparent 50%); mix-blend-mode: screen; opacity: 0; }

.card { position: absolute; width: 14cqw; aspect-ratio: 544/760; border-radius: 1cqw; background-size: cover; box-shadow: 0 1.2cqw 3cqw rgba(0,0,0,.6), 0 0 0 .2cqw rgba(255,255,255,.18); }
.fan .card { left: 50%; top: 50%; margin: -9.8cqw 0 0 -7cqw; opacity: 0; }
.chain { position: absolute; left: 50%; top: 50%; width: 150%; height: 13%; margin-left: -75%; margin-top: -6.5%; background: var(--chain) left center / auto 100% repeat-x; filter: drop-shadow(0 .3cqw .4cqw rgba(0,0,0,.8)); transform-origin: 0% 50%; opacity: 0; }
.hero { position: absolute; left: 50%; top: 50%; width: 15cqw; opacity: 0; }
.hero img { width: 100%; display: block; }
.fan .chain { width: 112%; margin-left: -56%; }
.finale .hero { top: auto; bottom: -1.5cqw; width: auto; }
.finale .hero img { height: var(--h); width: auto; }
.lockpad { position: absolute; left: 50%; top: 50%; width: 26%; aspect-ratio: 1; transform: translate(-50%, -50%); opacity: 0; filter: drop-shadow(0 .3cqw .6cqw rgba(0,0,0,.9)); }

.tour-strip { position: absolute; top: 50%; left: 0; display: flex; gap: 6cqw; transform: translate(60cqw, -55%); }
.tour-item { display: grid; justify-items: center; gap: 1.4cqw; }
.tour-item .card { position: relative; width: 17cqw; }
.tour-item .card .art { position: absolute; inset: 0; border-radius: inherit; background: inherit; background-size: cover; filter: grayscale(1) brightness(.5); }
.tour-item b { font: 900 1.6cqw/1 var(--head); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }

.rays { position: absolute; left: 50%; top: 50%; width: 150cqw; height: 150cqw; margin: -75cqw 0 0 -75cqw; border-radius: 50%; background: repeating-conic-gradient(from 0deg, transparent 0 8deg, var(--ray, rgba(201,77,242,.24)) 8deg 11deg); -webkit-mask: radial-gradient(circle, #000 0 16%, transparent 52%); mask: radial-gradient(circle, #000 0 16%, transparent 52%); opacity: 0; }
.pass { position: absolute; left: 50%; top: 50%; width: 42cqw; margin-left: -21cqw; margin-top: -12.5cqw; border-radius: 2cqw; padding: 2.6cqw 3cqw; box-sizing: border-box; background: linear-gradient(140deg, rgba(40,20,52,.94), rgba(12,6,16,.97)); box-shadow: 0 0 0 .25cqw var(--violet), 0 0 7cqw rgba(201,77,242,.7); display: grid; gap: 1.6cqw; opacity: 0; overflow: hidden; }
.pass img { width: 17cqw; }
.pass .who { font: 900 5cqw/1 var(--head); text-transform: uppercase; }
.pass .meta { display: flex; justify-content: space-between; font: 700 1.5cqw/1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
.pass .meta b { color: var(--violet); }
.pass .sheen { position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); transform: translateX(-120%); }

.power .card { left: 50%; top: 50%; width: 19cqw; margin: -13.3cqw 0 0 -9.5cqw; }
.power .card .art { position: absolute; inset: 0; border-radius: inherit; background: inherit; background-size: cover; filter: grayscale(1) brightness(.55); }
.ring { position: absolute; left: 50%; top: 50%; width: 38cqw; height: 38cqw; margin: -19cqw 0 0 -19cqw; transform: rotate(-90deg); overflow: visible; }
.ring circle { fill: none; stroke-width: 1.1; }
.chip { position: absolute; left: 50%; top: 50%; padding: .9cqw 1.6cqw; border-radius: 99px; font: 900 1.8cqw/1 var(--head); white-space: nowrap; background: var(--violet); color: #fff; box-shadow: 0 .6cqw 2cqw rgba(0,0,0,.5), 0 0 2cqw rgba(201,77,242,.6); opacity: 0; }
.chip small { font: 700 1.3cqw/1 var(--body); opacity: .85; margin-left: .6cqw; }
.awake { position: absolute; left: 50%; top: 85%; transform: translateX(-50%); font: 900 2.4cqw/1 var(--head); letter-spacing: .2em; text-transform: uppercase; color: #8ff5e6; text-shadow: 0 0 2cqw #2ec4b6; opacity: 0; white-space: nowrap; }
.guide { position: absolute; height: 34cqw; bottom: 0; filter: drop-shadow(0 0 2cqw rgba(0,0,0,.6)); opacity: 0; }

.crystals { position: absolute; left: 5cqw; top: 9cqw; display: grid; gap: 1.2cqw; }
.crystals .count { font: 900 4.4cqw/1 var(--head); text-shadow: 0 .3cqw 1.5cqw rgba(0,0,0,.7); font-variant-numeric: tabular-nums; }
.crystals .count small { font: 700 1.6cqw/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); display: block; margin-top: .6cqw; }
.gems { display: flex; gap: .8cqw; }
.gems i { width: 2.4cqw; height: 3.2cqw; clip-path: polygon(50% 0, 100% 35%, 50% 100%, 0 35%); background: rgba(255,255,255,.18); }
.gems i.on { background: linear-gradient(160deg, #f3c8ff, #C94DF2 55%, #6d1f8c); filter: drop-shadow(0 0 .8cqw #C94DF2); }

.wall { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 45%, #4a2e1d, #1d1109 72%); }
.wall::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 .2cqw, transparent .2cqw 6cqw); }
.window { position: absolute; left: 8cqw; top: 7cqw; width: 40cqw; height: 40cqw; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 1.6cqw #7a4b2a, 0 0 0 2.2cqw #3d2414, 0 2cqw 4cqw rgba(0,0,0,.7), inset 0 0 4cqw rgba(0,0,0,.5); }
.window .cover { inset: -8%; }
.sunbeam { position: absolute; left: 20cqw; top: 10cqw; width: 70cqw; height: 22cqw; background: linear-gradient(90deg, rgba(190,230,255,.22), transparent); transform: rotate(18deg); transform-origin: 0 50%; filter: blur(1.5cqw); mix-blend-mode: screen; }
.shelf { position: absolute; left: 54cqw; right: 5cqw; top: 39cqw; height: 1.6cqw; background: linear-gradient(#9a6235, #5b3519); border-radius: .4cqw; box-shadow: 0 1.2cqw 2cqw rgba(0,0,0,.6); }
.treehouse .card { width: 11cqw; top: 23.6cqw; opacity: 0; }

.finale .card { left: 50%; top: 100%; width: 11cqw; margin-left: -5.5cqw; opacity: 0; }
.violet { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, #3a1150, #050307 72%); opacity: 0; }
.logo-wrap { position: absolute; left: 50%; top: 42%; width: 48cqw; transform: translate(-50%, -50%); opacity: 0; }
.logo-wrap img { width: 100%; display: block; filter: drop-shadow(0 0 3cqw rgba(201,77,242,.55)); }
.shine { position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,.9) 50%, transparent 65%); background-size: 300% 100%; background-position: 120% 0; mix-blend-mode: overlay; -webkit-mask: var(--logo) center/contain no-repeat; mask: var(--logo) center/contain no-repeat; }
.tag3 { position: absolute; left: 50%; top: 59%; transform: translateX(-50%); display: flex; gap: 5cqw; font: 900 2.2cqw/1 var(--head); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
.tag3 span { opacity: 0; }
.go { position: absolute; left: 50%; top: 71%; transform: translateX(-50%); font: 900 2.4cqw/1 var(--head); text-transform: uppercase; letter-spacing: .06em; background: var(--violet); padding: 1.4cqw 3cqw; border-radius: 99px; box-shadow: inset 0 -.3cqw 0 var(--violet-deep), 0 0 4cqw rgba(201,77,242,.6); opacity: 0; white-space: nowrap; border: 0; color: #fff; cursor: pointer; pointer-events: none; }
.go.live { pointer-events: auto; }
.go:focus-visible { outline: .3cqw solid #fff; outline-offset: .4cqw; }

.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; mix-blend-mode: screen; }
.bars::before, .bars::after { content: ""; position: absolute; left: 0; right: 0; height: var(--bar, 6.2cqw); background: #000; z-index: 3; }
.bars::before { top: 0; } .bars::after { bottom: 0; }
.bars { position: absolute; inset: 0; pointer-events: none; }
.grain { position: absolute; inset: 0; pointer-events: none; opacity: .09; mix-blend-mode: overlay; background-size: 256px 256px; }
.vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 14cqw rgba(0,0,0,.7); }
.caption { position: absolute; left: 50%; bottom: 7.6cqw; transform: translateX(-50%); width: max-content; max-width: 80cqw; text-align: center; font: 700 2.3cqw/1.3 var(--body); padding: .7cqw 1.6cqw; border-radius: .8cqw; background: rgba(0,0,0,.55); color: #fff; z-index: 4; text-wrap: balance; text-shadow: 0 .2cqw .6cqw #000; }
.caption:empty { display: none; }
.bigplay { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; align-content: center; gap: 1.4cqw; background: rgba(0,0,0,.35); border: 0; cursor: pointer; padding: 0; color: #fff; font: 700 1.8cqw/1 var(--body); }
.bigplay span { width: 10cqw; height: 10cqw; border-radius: 50%; background: var(--violet); display: grid; place-items: center; box-shadow: 0 0 0 1.2cqw rgba(201,77,242,.3); }
.bigplay svg { width: 38%; margin-left: 8%; fill: #fff; }@media (max-width: 760px) { .caption { font-size: 3.2cqw; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div id="cam"><div id="shake">
    <div class="layer" id="L-tower">
      <div class="cover" id="towerArt" style="background-image:url(art/tower.jpg)"></div>
      <div class="godrays" id="rays0"></div>
      <div class="beam" id="beam"></div>
    </div>
    <canvas class="fx" id="fogc"></canvas>
    <div class="layer fan" id="L-fan"></div>
    <div class="layer" id="L-tour" style="background:radial-gradient(ellipse at 50% 45%, #1d1424, #060408 75%)"><div class="tour-strip" id="strip"></div></div>
    <div class="layer" id="L-you" style="background:radial-gradient(circle at 50% 50%, #1c0b26, #030204 70%)">
      <div class="rays" id="raysYou" style="--ray: rgba(255,210,120,.22)"></div>
      <div class="pass" id="pass"><img src="art/logo.png" alt="RELIQ"><div class="who" id="passName">Explorer</div><div class="meta"><span id="passCodeRow">Explorer <b id="passCode"></b></span><span id="passYear"></span></div><div class="sheen" id="sheen"></div></div>
    </div>
    <div class="layer power" id="L-power" style="background:radial-gradient(circle at 50% 50%, #0f2a2b, #030809 72%)">
      <div class="rays" id="raysPow" style="--ray: rgba(46,196,182,.26)"></div>
      <svg class="ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" stroke="rgba(255,255,255,.12)"/><circle id="ringFill" cx="20" cy="20" r="18" stroke="#2EC4B6" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" style="filter:drop-shadow(0 0 .6px #2EC4B6)"/></svg>
      <div class="card" id="powerCard" style="background-image:url(art/card-number-nexus.jpg)"><div class="art" id="powerArt"></div></div>
      <div id="chips"></div>
      <img class="guide" id="numbot" src="art/numbot.png" alt="" style="right:3cqw">
      <div class="awake" id="awake">Numbot awakened</div>
    </div>
    <div class="layer" id="L-spire"><div class="cover" id="spireArt" style="background-image:url(art/spire.jpg)"></div><div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.65),transparent 55%)"></div>
      <div class="beam" id="spireBeam" style="top:-5%;height:62%;width:6cqw;margin-left:-3cqw;background:linear-gradient(180deg,rgba(220,150,255,0),rgba(220,150,255,.8) 70%,#fff)"></div>
      <div class="crystals"><div class="count" id="dayCount">Day 0<small>Chrono Crystals</small></div><div class="gems" id="gems"></div></div>
      <img class="guide" id="chronorok" src="art/chronorok.png" alt="" style="right:6cqw">
    </div>
    <div class="layer treehouse" id="L-tree"><div class="wall"></div><div class="window"><div class="cover" id="auroraArt" style="background-image:url(art/aurora.jpg)"></div></div><div class="sunbeam"></div><div class="shelf"></div></div>
    <div class="layer finale" id="L-final">
      <div class="cover" id="finalArt" style="background-image:url(art/tower.jpg)"></div>
      <div class="godrays" id="raysFinal"></div>
      <div class="violet" id="violet"></div>
      <div class="logo-wrap" id="logoWrap"><img src="art/logo.png" alt="RELIQ"><div class="shine" id="shine"></div></div>
      <div class="tag3" id="tag3"><span>Explore</span><span>Learn</span><span>Collect</span></div>
      <button class="go" id="go" type="button" tabindex="-1">Start my adventure</button>
    </div>
    <div id="halo"></div>
    <canvas class="fx" id="fx"></canvas>
    <div class="flash" id="flash"></div>
  </div></div>
  <div class="vignette"></div>
  <div class="grain" id="grain"></div>
  <div class="bars" id="bars"></div>
  <div class="caption" id="caption" aria-live="polite"></div>
  <button class="bigplay" id="bigplay" type="button" aria-label="Play the intro"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l15 8-15 8z"/></svg></span><b id="bigplayLabel">Tap to play. Sound on!</b></button>
</div>
<script src="film.js"></script>
</body>
</html>
