
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="splash_pool marketplace render">
      
    <defs>
      <linearGradient id="front" x1="0" x2="1" y1="0" y2="1">
