<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Measurelands Realmies Review</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 42px;
        color: #173b35;
        background: #edf5ef;
        font-family: Arial, sans-serif;
      }
      header { margin-bottom: 30px; }
      h1 { margin: 0 0 8px; font-size: 42px; }
      p { margin: 0; color: #58716b; font-size: 18px; }
      main {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 20px;
      }
      article {
        min-width: 0;
        padding: 20px;
        border: 1px solid #c9d8ce;
        border-radius: 8px;
        background: #fff;
      }
      img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; }
      h2 { margin: 14px 0 4px; font-size: 22px; }
      small { color: #758a85; }
    </style>
  </head>
  <body>
    <header>
      <h1>Measurelands Realmies</h1>
      <p>Phase 3 digital 3D prototypes. Production engineering remains pending.</p>
    </header>
    <main>
      <article><img src="../measurelands-gaugekin-standard/hero-transparent.png" alt=""><h2>Gaugekin</h2><small>Common · 44 mm target</small></article>
      <article><img src="../measurelands-ruleroot-standard/hero-transparent.png" alt=""><h2>Ruleroot</h2><small>Rare · 48 mm target</small></article>
      <article><img src="../measurelands-compass-keeper-standard/hero-transparent.png" alt=""><h2>Compass Keeper</h2><small>Epic · 51 mm target</small></article>
      <article><img src="../measurelands-golden-surveyor-standard/hero-transparent.png" alt=""><h2>Golden Surveyor</h2><small>Legendary · 54 mm target</small></article>
    </main>
  </body>
</html>
